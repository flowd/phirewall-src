name: Mutation Testing

# Runs Infection on a schedule only, kept out of ci.yml so it never blocks PRs.
on:
  schedule:
    # Sundays at 03:30 UTC
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infection:
    name: Infection (${{ matrix.package }}, PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [ phirewall-preset-owasp-crs ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, json
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Infection looks for vendor/bin/phpunit inside the package, so the root vendor/
      # directory is linked into it for the run (never committed).
      - name: Run Infection
        working-directory: packages/${{ matrix.package }}
        env:
          XDEBUG_MODE: coverage
        run: |
          ln -s ../../vendor vendor
          ../../vendor/bin/infection --threads=max --show-mutations
