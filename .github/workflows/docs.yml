name: Build Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          package_json_file: docs-site/package.json
          cache: true
          cache_dependency_path: docs-site/pnpm-lock.yaml
      - run: pnpm ci
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs-site/docs/.vitepress/dist
          retention-days: 30
