name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rector, PHP-CS-Fixer and PHPStan run over all packages from the monorepo root.
  static:
    name: Static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, json
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-all --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate the package composer.json files
        run: composer monorepo:validate

      - name: Run Rector (dry-run)
        run: composer rector:check

      - name: Run PHP-CS-Fixer (dry-run)
        run: composer cs:check

      - name: Run PHPStan
        run: composer phpstan

  # One PHPUnit run per package against the shared root vendor/ directory.
  tests:
    name: ${{ matrix.package }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        package: [ core, owasp-crs, bots, bad-ips ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, json
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: composer phpunit:${{ matrix.package }}

      - name: Run performance benchmarks
        if: matrix.package == 'core'
        env:
          PHIREWALL_RUN_BENCHMARKS: '1'
          XDEBUG_MODE: 'off'
        run: vendor/bin/phpunit --configuration packages/phirewall/phpunit.xml.dist --group=performance --no-coverage

  # The examples require ../vendor/autoload.php relative to their package, so the
  # root vendor/ directory is linked into the package for the run (never committed).
  examples:
    name: ${{ matrix.package }} examples on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        package: [ phirewall, phirewall-preset-owasp-crs, phirewall-preset-bots, phirewall-preset-bad-ips ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, json, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run all examples with strict error handling
        working-directory: packages/${{ matrix.package }}
        run: |
          ln -s ../../vendor vendor
          failed=0
          for file in examples/*.php; do
            echo "::group::${file}"
            if php -d "error_reporting=-1" -d "display_errors=stderr" -d "log_errors=0" \
                -r "set_error_handler(function(int \$severity, string \$message, string \$file, int \$line): never {
                    throw new ErrorException(\$message, 0, \$severity, \$file, \$line);
                }); require '${file}';" 2>&1; then
              echo "PASS"
            else
              echo "FAIL: ${file}"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "FAILED: ${failed} example(s) failed"
            exit 1
          fi
          echo "All examples passed"

  # Installs every package on its own, the way a user would. The root vendor/ hides
  # missing "require" entries, so this is the check that the package composer.json
  # files are complete. Extensions get the core from this checkout because the
  # constraint on the not yet released version cannot be resolved from Packagist.
  package-check:
    name: ${{ matrix.package }} standalone (${{ matrix.stability }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ phirewall, phirewall-preset-owasp-crs, phirewall-preset-bots, phirewall-preset-bad-ips ]
        stability: [ lowest, stable ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, json
          coverage: none

      - name: Point the extensions at the core of this checkout
        if: matrix.package != 'phirewall'
        working-directory: packages/${{ matrix.package }}
        run: |
          alias="$(jq -r '.extra["branch-alias"]["dev-main"]' ../phirewall/composer.json)"
          composer config repositories.core "$(jq -nc --arg alias "$alias" \
            '{type: "path", url: "../phirewall", options: {symlink: false, versions: {"flowd/phirewall": $alias}}}')"
          # The checkout only provides the core as a dev alias, stable releases stay preferred.
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-stable --prefer-dist --no-progress --no-interaction
          fi

      - name: Run PHPUnit
        working-directory: packages/${{ matrix.package }}
        env:
          XDEBUG_MODE: 'off'
        run: vendor/bin/phpunit --no-coverage

      - name: Check for undeclared and unused dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          composer global config --no-plugins allow-plugins.infection/extension-installer false
          composer global require --no-progress --no-interaction shipmonk/composer-dependency-analyser
          "$(composer global config bin-dir --absolute --quiet)/composer-dependency-analyser"

  # Single stable check name for branch protection: require only "CI passed"
  # instead of every matrix job, so the required-checks list survives matrix changes.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, tests, examples, package-check]
    if: always()
    steps:
      - name: Fail when a needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A needed job failed, was cancelled or was skipped."
          exit 1

      - name: Confirm success
        run: echo "All needed jobs succeeded."
